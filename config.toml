[server]
maxUploadSize = 200
headless = true
enableXsrfProtection = true
enableCORS = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#070b14"
secondaryBackgroundColor = "#0d1424"
textColor = "#e6edf7"
font = "sans serif"
